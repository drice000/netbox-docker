version: "3.9"

services:
  postgres:
    image: docker.io/postgres:15
    container_name: netbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
    volumes:
      - netbox-postgres-data:/var/lib/postgresql/data
    networks:
      Vlan1:
        ipv4_address: 172.31.240.61

  redis:
    image: docker.io/redis:7
    container_name: netbox-redis
    restart: unless-stopped
    volumes:
      - netbox-redis-data:/data
    networks:
      Vlan1:
        ipv4_address: 172.31.240.60

  redis-cache:
    image: docker.io/redis:7
    container_name: netbox-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      Vlan1:
        ipv4_address: 172.31.240.59

  netbox:
    image: docker.io/netboxcommunity/netbox:v4.4-3.4.1
    container_name: netbox
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - redis-cache
    env_file:
      - ./env/netbox.env
    volumes:
      - netbox-media:/opt/netbox/netbox/media
      - netbox-reports:/opt/netbox/netbox/reports
      - netbox-scripts:/opt/netbox/netbox/scripts
    networks:
      Vlan1:
        ipv4_address: 172.31.240.62

networks:
  Vlan1:
    external: true

volumes:
  netbox-postgres-data:
  netbox-redis-data:
  netbox-media:
  netbox-reports:
  netbox-scripts:
